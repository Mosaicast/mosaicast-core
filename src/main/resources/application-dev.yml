#
# Local development profile. Activate with: --spring.profiles.active=dev
#
# WARNING: this profile enables the dev-login bypass (added in M2), which mints a session
# for any role WITHOUT Discord. It exists ONLY under the `dev` profile and must never be
# active in production. Do not add dev-login settings to .env.example or docker-compose.yml.

spring:
  jpa:
    show-sql: false
  flyway:
    clean-disabled: false

mosaicast:
  security:
    # Local dev runs over plain http; don't mark the session cookie Secure (prod default is true).
    secure-cookie: false

logging:
  level:
    dev.mosaicast: DEBUG
