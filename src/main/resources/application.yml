#
# Default (production) configuration. Values bind to the environment variables that
# docker-compose.yml supplies; the localhost fallbacks are for running outside Docker.

spring:
  application:
    name: mosaicast-core
  datasource:
    url: ${MOSAICAST_DB_URL:jdbc:postgresql://localhost:5432/mosaicast}
    username: ${MOSAICAST_DB_USER:mosaicast}
    password: ${MOSAICAST_DB_PASSWORD:mosaicast}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (ARCHITECTURE §2) — Hibernate never mutates it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Hibernate detects Jackson by its old com.fasterxml package, so from Jackson 3 it finds none and
          # JSONB mapping breaks. Ours also pins the temporal encoding to what existing rows use.
          json_format_mapper: dev.mosaicast.core.config.Jackson3JsonFormatMapper
  flyway:
    enabled: true
    # SQL migrations, plus a package for the rare migration that must call application code. V33 backfills
    # `display_key` with the same canonicaliser the runtime validator uses (ARCHITECTURE §8.6) — a SQL
    # approximation of it would disagree on some unicode nobody anticipated, and the symptom would be a
    # unique index rejecting names the validator had just accepted. Java migrations are found by package,
    # which is why the second entry is a package path and not a resource directory.
    locations: classpath:db/migration, classpath:dev/mosaicast/core/db/migration
  servlet:
    multipart:
      # The container-level ceiling, above every endpoint's own (ARCHITECTURE §13 upload limits). It has to
      # clear `mosaicast.plugin-blobs.max-file-bytes`, or a plugin upload inside its granted limit would be
      # refused by the servlet before any code that could explain why.
      #
      # This is deliberately NOT the effective cap for any endpoint: branding still enforces its own 2 MB in
      # BrandingService, and a plugin gets the smaller of its manifest's ask and the operator's ceiling. A
      # bigger number here only means the refusal comes from code that can say which rule refused it.
      max-file-size: ${MOSAICAST_MAX_UPLOAD_SIZE:12MB}
      max-request-size: ${MOSAICAST_MAX_REQUEST_SIZE:16MB}

# Host-wide settings (bound in feature @ConfigurationProperties as they land).
mosaicast:
  base-url: ${MOSAICAST_BASE_URL:http://localhost:8080}
  plugins-dir: ${MOSAICAST_PLUGINS_DIR:./plugins}
  # Basic rate limiting on auth endpoints and uploads (ARCHITECTURE §13). Two buckets, because a flood of
  # logins is credential stuffing and a flood of uploads is a disk problem. Set far above human use and far
  # below automated use. In-memory per instance until Redis arrives at v3.
  rate-limit:
    enabled: ${MOSAICAST_RATE_LIMIT_ENABLED:true}
    auth-limit: ${MOSAICAST_RATE_LIMIT_AUTH:20}
    auth-window: 1m
    upload-limit: ${MOSAICAST_RATE_LIMIT_UPLOAD:10}
    upload-window: 1m
  # Which backend stores which blob namespace (ARCHITECTURE §11). Two are registered: `postgres`, and
  # `filesystem` once `filesystem.root` is set — an object-store backend becomes a bean plus a line here.
  #
  #   namespaces:
  #     plugin: filesystem   # every plugin's files, matched by prefix
  #     branding: postgres
  #
  # Keys match as exact namespaces first, then by longest `/` prefix. A name with no backend behind it
  # fails startup rather than falling through to the default — a typo here would otherwise put files in a
  # store the operator did not choose, and the symptom appears long after the cause.
  blobs:
    default-backend: ${MOSAICAST_BLOB_BACKEND:postgres}
    # The `filesystem` backend registers only when a root is configured, which is why this stays
    # commented out rather than defaulting to an empty string: an install that never asked for file
    # storage on disk should not acquire a directory. Set both lines to move plugin files there, and back
    # the directory up like any other data — the objects and their JSON sidecars are portable on purpose.
    #
    # namespaces:
    #   plugin: filesystem
    # filesystem:
    #   root: /var/lib/mosaicast/blobs

  # Plugin file storage (ARCHITECTURE §11.1). Two kinds of number, and the difference matters:
  #
  #   default-*  what a plugin gets when nobody has said otherwise. Conservative on purpose — plugin blobs
  #              are the first unbounded write a plugin can make.
  #   hard-*     the most an ADMIN may grant from the web UI. UNSET by default, i.e. the admin decides.
  #              Set these only where the person deploying and the person logged in as ADMIN are not the
  #              same, and the former wants a bound the latter cannot cross.
  #
  # A per-plugin grant made in the admin UI wins over the plugin's manifest, and is where "the wiki has
  # outgrown its space" is answered — not here, and not by a redeploy.
  plugin-blobs:
    default-max-file-bytes: ${MOSAICAST_PLUGIN_BLOB_MAX_FILE:10485760}
    default-quota-bytes: ${MOSAICAST_PLUGIN_BLOB_QUOTA:268435456}
    hard-max-file-bytes: ${MOSAICAST_PLUGIN_BLOB_HARD_MAX_FILE:}
    hard-quota-bytes: ${MOSAICAST_PLUGIN_BLOB_HARD_QUOTA:}
    # What may be stored at all. A plugin cannot reach past this by declaring more. SVG is not listed and
    # cannot be added — it is a script container wearing an image's extension (§12.2), and nothing here
    # sanitises it.
    allowed-mime-types: image/png,image/jpeg,image/webp,image/gif,image/avif,audio/mpeg,audio/mp4,audio/ogg,audio/wav
  auth:
    # The (provider, external_id) granted ADMIN on first login (ARCHITECTURE §8.5).
    bootstrap-provider: ${ADMIN_BOOTSTRAP_PROVIDER:}
    bootstrap-external-id: ${ADMIN_BOOTSTRAP_EXTERNAL_ID:}
  # The avatar proxy (ARCHITECTURE §8.7). Pictures are fetched from the provider the user chose, served as
  # bytes by the host, and held in memory only — a picture the host *stores* is a picture the host has to
  # moderate, retain and erase, which is exactly what §8.7 declines to take on.
  avatar:
    # Asked of providers that support it, so the byte cap is not doing the work: Discord serves 1024px by
    # default and the shell never renders more than a few dozen.
    size-px: ${MOSAICAST_AVATAR_SIZE:128}
    max-image-bytes: ${MOSAICAST_AVATAR_MAX_BYTES:262144}
    # A ceiling on the whole cache in BYTES, not an entry count — 500 entries of unknown size is not a
    # limit, it is a hope.
    cache-bytes: ${MOSAICAST_AVATAR_CACHE_BYTES:33554432}
    # Long enough to be a cache, short enough that a changed Discord picture appears the same day.
    ttl: ${MOSAICAST_AVATAR_TTL:15m}
    # Failures are cached too, briefly. Without this one 404 behind a leaderboard is an outbound request
    # per page view.
    failure-ttl: ${MOSAICAST_AVATAR_FAILURE_TTL:1m}
    timeout: ${MOSAICAST_AVATAR_TIMEOUT:5s}
  # The notification inbox (ARCHITECTURE §17.2). An inbox nobody empties is not a feature, and an
  # unbounded one is a table that only grows — so read notifications expire and unread ones are capped.
  notifications:
    # Only *read* notifications are swept. An unread one is something the site still has to say, however
    # old; the backlog is bounded by the cap below instead.
    read-retention: ${MOSAICAST_NOTIFICATION_RETENTION:30d}
    purge-interval-ms: ${MOSAICAST_NOTIFICATION_PURGE_INTERVAL_MS:86400000}
    # A backstop against an unbounded table, not a UX rule: a user who reaches it has a plugin behaving
    # badly, and the per-plugin rate limits (§17.1) should have caught that first. Past the cap the
    # *oldest* unread are trimmed, so someone who has stopped reading their bell still sees what just
    # happened.
    max-unread-per-user: ${MOSAICAST_NOTIFICATION_MAX_UNREAD:200}
    max-text-length: ${MOSAICAST_NOTIFICATION_MAX_TEXT:500}
  # What a display name may be (ARCHITECTURE §8.6). The lists live in configuration and not in code because
  # an operator's language and jurisdiction are not ours to guess: a German-market install needs German
  # slurs, a self-hoster needs their own list, and neither should have to fork the host to get one.
  #
  # `blocked` ships empty on purpose. A default list would be English-only, would read as this project's
  # opinion of which words are unacceptable, and would silently under-serve every other market — the two
  # locales the shell ships (§12.7) are already more than one such list could cover. §8.6 is explicit that
  # this is a speed bump anyway: word lists lose to compounds and produce false positives, and the actual
  # control is the admin revert (§8.6.1).
  display-name:
    min-length: ${MOSAICAST_DISPLAY_NAME_MIN:3}
    max-length: ${MOSAICAST_DISPLAY_NAME_MAX:32}
    # How long after changing their name a user must wait to change it again. Also the freeze an admin
    # revert applies, so a reverted name does not simply go straight back.
    rename-cooldown: ${MOSAICAST_DISPLAY_NAME_COOLDOWN:24h}
    # Matched on the whole canonical key: `admin` is taken, `administrator` is a plausible person.
    reserved:
      - admin
      - administrator
      - moderator
      - system
      - support
      - mosaicast
    # Matched as substrings of the aggressive key (leetspeak folded, punctuation removed).
    blocked: []
  feed:
    # Whether a feed URL may point at a private address (loopback, link-local, RFC-1918, ...).
    #
    # OFF by default, and it should stay off anywhere reachable from a network you do not control: a feed URL
    # is fetched server-side, and the preview endpoint returns what came back, so an internal address here is
    # SSRF with the response handed to the caller. The endpoint is open to PODCASTER, not only ADMIN.
    #
    # Turn it on only for a self-hosted install that genuinely pulls a feed from another host on its own LAN.
    allow-private-targets: ${MOSAICAST_FEED_ALLOW_PRIVATE_TARGETS:false}
    # The second key for the same lock: with allow-private-targets on and this off, the app refuses to
    # start. One variable is too easy to set while chasing something else and leave behind, and the failure
    # mode is silent — everything keeps working, only the SSRF filter is gone. Two say you meant it.
    allow-private-targets-confirmed: ${MOSAICAST_FEED_ALLOW_PRIVATE_TARGETS_CONFIRMED:false}
  security:
    # Narrow CSP img-src/media-src from the blanket `https:` to the origins this site's content actually
    # uses (derived from feed and episode artwork/audio) plus the plugin hosts the visitor consented to.
    #
    # OFF by default. The blanket exists because artwork comes from whatever host a feed points at, and the
    # derivation cannot see a host nothing references yet — an image inside show-note HTML, a feed added a
    # minute ago. Turning it on closes a real gap (any https image is otherwise a working one-way beacon
    # that side-steps connect-src and consent) at the cost of a blank artwork tile when it guesses short.
    strict-media-sources: ${MOSAICAST_STRICT_MEDIA_SOURCES:false}
    # Origins to allow on top of the derived set, comma-separated (e.g. https://cdn.example.com). Only
    # consulted in strict mode; this is where a host the derivation cannot see goes.
    #
    # Expect to need it. The derivation sees the URL a feed publishes, the browser enforces against the URL
    # it ends up at, and most media CDNs redirect — so the redirect target belongs here too. Check the
    # browser console after switching strict mode on: a missing origin is a blank artwork tile.
    extra-media-sources: ${MOSAICAST_EXTRA_MEDIA_SOURCES:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Mosaicast
    description: Extensible website platform for podcasts

server:
  # Honor X-Forwarded-* from a fronting TLS proxy so the app builds correct absolute URLs — notably the
  # OAuth2 redirect URI ({baseUrl}/login/oauth2/code/discord). Without this, behind a proxy the app derives
  # http://<internal-host> and Discord rejects the redirect. Safe when not proxied (no such headers arrive).
  forward-headers-strategy: framework
  # Uploads are bounded (ARCHITECTURE §13); tightened per-endpoint later.
  tomcat:
    max-http-form-post-size: 20MB
  error:
    whitelabel:
      enabled: false
