#
# Copy into the core repo root. Local v1 stack: app + Postgres.
# Start:  cp .env.example .env  (fill in)  →  docker compose up --build
# Redis + reverse proxy are prepared for v3 and commented out.
# Backups: schedule a nightly pg_dump of the db (host cron or a sidecar), keep a copy off the VPS, and test a restore once.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mosaicast}
      POSTGRES_USER: ${POSTGRES_USER:-mosaicast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - mosaicast-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mosaicast} -d ${POSTGRES_DB:-mosaicast}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      # The backend image fetches the plugin SDK's Java artifacts from GitHub Packages (auth required
      # even for public reads). These BuildKit secrets carry a token to the Gradle step only — they are
      # never baked into the image. Set GITHUB_ACTOR / GITHUB_TOKEN (PAT with read:packages) in .env.
      secrets:
        - github_actor
        - github_token
    depends_on:
      db:
        condition: service_healthy
    environment:
      # core maps these to its properties in application.yml.
      MOSAICAST_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mosaicast}
      MOSAICAST_DB_USER: ${POSTGRES_USER:-mosaicast}
      MOSAICAST_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      MOSAICAST_PLUGINS_DIR: /app/plugins
      # Plugins to fetch at boot (see .env.example). Empty by default: an install that wants none downloads
      # nothing. Prebuilt release tarballs only in the container — no git or JDK in the runtime image.
      MOSAICAST_PLUGINS: ${MOSAICAST_PLUGINS:-}
      MOSAICAST_PLUGINS_REPLACE: ${MOSAICAST_PLUGINS_REPLACE:-false}
      MOSAICAST_BASE_URL: ${MOSAICAST_BASE_URL:-http://localhost:8080}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Secure session cookie (default true). Set false only for a plain-http local run (see .env.example);
      # social login needs a secure context, so over http on a LAN IP the cookie is dropped and login fails.
      MOSAICAST_SECURITY_SECURE_COOKIE: ${MOSAICAST_SECURITY_SECURE_COOKIE:-true}
      ADMIN_BOOTSTRAP_PROVIDER: ${ADMIN_BOOTSTRAP_PROVIDER:-discord}
      ADMIN_BOOTSTRAP_EXTERNAL_ID: ${ADMIN_BOOTSTRAP_EXTERNAL_ID:-}
      MOSAICAST_ENCRYPTION_KEY: ${MOSAICAST_ENCRYPTION_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./plugins:/app/plugins        # drop built plugins here (= MOSAICAST_PLUGINS_DIR in the container)
    healthcheck:                      # Spring Actuator; make sure wget (or curl) exists in the runtime image
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # --- v3 (commented out, until load-balanced / Redis sessions are needed) ---
  # redis:
  #   image: redis:7-alpine
  #   volumes: [ mosaicast-redis:/data ]
  #   restart: unless-stopped
  # proxy:
  #   image: caddy:2-alpine
  #   ports: [ "80:80", "443:443" ]
  #   volumes: [ ./Caddyfile:/etc/caddy/Caddyfile, caddy-data:/data ]
  #   depends_on: [ app ]

volumes:
  mosaicast-db:
  # mosaicast-redis:
  # caddy-data:

# Build-time secrets for resolving the plugin SDK from GitHub Packages (see the app.build.secrets note).
# Sourced from the environment (compose loads .env), so nothing sensitive is committed.
secrets:
  github_actor:
    environment: GITHUB_ACTOR
  github_token:
    environment: GITHUB_TOKEN
