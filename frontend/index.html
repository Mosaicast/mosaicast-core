<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Default favicon (the Mosaicast mark). Once branding lands (M3), the host swaps this for the
         dynamic /branding/favicon endpoint, which falls back to this same default when the admin has
         not uploaded a custom favicon. -->
    <link rel="icon" type="image/svg+xml" href="/brand/mosaicast-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosaicast</title>
    <!-- No theme flash (ARCHITECTURE §12.3): a same-origin blocking script that sets data-theme + the
         accent tokens before first paint. External (not inline) so it satisfies the strict
         `script-src 'self'` CSP. See public/theme-init.js. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
