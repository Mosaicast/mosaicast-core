#
# On a published GitHub Release, build the container image and push it to the GitHub Container
# Registry (GHCR) as ghcr.io/mosaicast/mosaicast-core:<version> and :latest. Production deployments
# pull that image (docker-compose.prod.yml) instead of building.
#
# Cut a release: tag the commit `vX.Y.Z` (matching gradle.properties) and publish a GitHub Release.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags from the release tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the image's core version from the release tag (feeds /api/meta).
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          # The backend stage resolves the SDK's Java artifacts from GitHub Packages.
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ secrets.GITHUB_TOKEN }}
