#
# Publish the core container image when a GitHub Release is published (NOT on PR merge).
#
# Flow: draft a Release with a tag like `v0.1.0`. This workflow verifies the tag matches the version
# anchor (gradle.properties), then builds + pushes the image:
#   - ghcr.io/mosaicast/mosaicast-core → GitHub Container Registry (tag + :latest)
#
# The version anchor is the source of truth; the tag must equal it. Bump it in gradle.properties.
name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify tag == version anchor
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches the core version
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_v="${TAG#v}"   # strip an optional leading 'v'
          gradle_v=$(grep -oP '^version\s*=\s*\K.+' gradle.properties | head -1)
          echo "tag=$tag_v gradle=$gradle_v"
          if [ "$gradle_v" != "$tag_v" ]; then
            echo "::error::Release tag '$TAG' ($tag_v) does not match the version anchor '$gradle_v' in gradle.properties. Bump gradle.properties and re-tag."
            exit 1
          fi
          echo "version=$tag_v" >> "$GITHUB_OUTPUT"
          echo "Core version aligned at $tag_v ✅"

  publish-image:
    name: Build & push image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to the GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      # QEMU lets Buildx cross-build the arm64 image on the amd64 runner. The image is a pure-JVM Spring
      # Boot jar on a multi-arch Temurin base, so arm64 runs unchanged — this just serves Raspberry Pi /
      # Apple Silicon / AWS Graviton hosts. Note: the arm64 stages build under emulation and are slow, but
      # releases are rare so it's acceptable. Future optimization: build the arch-independent jar once, then
      # assemble the per-arch runtime image (only the JRE base differs) to avoid emulating the Gradle build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.verify.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          # Stamp the image's core version from the verified tag (feeds /api/meta).
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
          # The backend stage resolves the SDK's Java artifacts from GitHub Packages.
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ secrets.GITHUB_TOKEN }}
