#
# Build + test on every PR and on pushes to the default branch (Definition of Done: green CI).
#
# The plugin SDK is published: @mosaicast/plugin-sdk on npm (public) and the Java artifacts
# (plugin-api / plugin-testkit) in GitHub Packages. The backend resolves the Java artifacts from
# GitHub Packages using the workflow's GITHUB_TOKEN; the frontend resolves the npm package normally.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Backend: unit + Testcontainers integration tests (Docker is available on the runner). Gradle
      # resolves the plugin SDK's Java artifacts from GitHub Packages using GITHUB_TOKEN.
      - name: Build backend
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon build

      # Frontend: install from the public npm registry (SDK included), test, build the shell bundle.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
