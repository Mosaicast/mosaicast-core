#
# Build + test on every PR and on pushes to the default branch (Definition of Done: green CI).
#
# The plugin SDK is published: @mosaicast/plugin-sdk on npm (public) and the Java artifacts
# (plugin-api / plugin-testkit) in GitHub Packages. The backend resolves the Java artifacts from
# GitHub Packages using the workflow's GITHUB_TOKEN; the frontend resolves the npm package normally.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Backend: unit + Testcontainers integration tests (Docker is available on the runner). Gradle
      # resolves the plugin SDK's Java artifacts from GitHub Packages using GITHUB_TOKEN.
      - name: Build backend
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon build

      # A number, printed where anyone reading the run can see it. Not a gate: a threshold picked today
      # would either sit below where the suite already is, and measure nothing, or fail builds for work
      # unrelated to it (core#190).
      - name: Backend coverage
        if: always()
        run: |
          report=build/reports/jacoco/test/jacocoTestReport.xml
          [ -f "$report" ] || { echo "no JaCoCo report"; exit 0; }
          python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for counter in root.findall('counter'):
              kind = counter.get('type')
              if kind in ('INSTRUCTION', 'BRANCH', 'LINE'):
                  covered, missed = int(counter.get('covered')), int(counter.get('missed'))
                  total = covered + missed
                  print(f"{kind.title():12} {covered}/{total}  {100 * covered / total:.1f}%")
          PY

      # Frontend: install from the public npm registry (SDK included), lint, test with coverage, build.
      #
      # The lint is not a style pass — it is `react-hooks/exhaustive-deps` and `jsx-a11y`, which between
      # them describe several defects this project has shipped (core#158, core#170, core#163, core#200)
      # and which `tsc --noEmit` cannot see.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:coverage
          npm run build

      # Advisory, not a gate: a transitive advisory with no fix available should not stop a PR that has
      # nothing to do with it. It is here so `npm audit` runs somewhere at all — the image build passes
      # --no-audit, correctly, and that meant it ran nowhere.
      - name: Frontend advisories
        if: always()
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      # `src/components/Icon.tsx` and `src/styles/icons.css` are generated from `dev/icons.txt`.
      # Regenerating and diffing is what keeps the committed artefacts honest: an edited whitelist
      # that was never regenerated fails here, on the PR, where the author can still fix it — rather
      # than being repaired by a bot commit that nobody reviewed and that CI never ran against.
      - name: Generated icons match dev/icons.txt
        working-directory: frontend
        run: |
          npm run icons
          # `--intent-to-add` first: `git diff` is blind to untracked files, so without it a PR that
          # adds a generated file but never commits it would pass a check designed to catch exactly
          # that. Staging the intent makes an untracked artefact show up as an addition.
          git add --intent-to-add src/components/Icon.tsx src/styles/icons.css
          git diff --exit-code -- src/components/Icon.tsx src/styles/icons.css || {
            echo "::error::dev/icons.txt and the generated icons disagree. Run 'npm run icons' and commit the result."
            exit 1
          }

      # The credit list is generated into two places at once — the About page and the notices file —
      # precisely so they cannot drift. That guarantee is only real if CI checks it.
      - name: Generated credits match dev/attributions.mjs
        working-directory: frontend
        run: |
          npm run attributions
          git add --intent-to-add src/generated/attributions.ts
          git diff --exit-code -- src/generated/attributions.ts ../THIRD-PARTY-NOTICES.md || {
            echo "::error::dev/attributions.mjs and the generated credits disagree. Run 'npm run attributions' and commit the result."
            exit 1
          }

  # The backend build and this image build can disagree: `processResources` pulls the message catalogs
  # from `frontend/src/locales`, a directory outside `src/`, and a Gradle copy from a missing directory
  # succeeds and copies nothing. A local build never sees it because the directory is always there; the
  # Docker build context is what decides. core#157 shipped that way, so the image is checked here as an
  # artifact rather than inferred from the source build.
  image:
    name: Image ships its message catalogs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the production image
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx build \
            --secret id=github_actor,env=GITHUB_ACTOR \
            --secret id=github_token,env=GITHUB_TOKEN \
            --load -t mosaicast-core:ci .

      # Read the jar out of the image instead of inspecting it inside: the runtime stage is a slim JRE
      # with neither `unzip` nor the `jar` tool, and adding one to the shipped image to support a test
      # would be the wrong trade.
      - name: The jar carries the bundled catalogs
        run: |
          cid=$(docker create mosaicast-core:ci)
          docker cp "$cid:/app/app.jar" ./app.jar
          docker rm "$cid" >/dev/null
          missing=0
          for code in en de; do
            if ! unzip -l app.jar | grep -q "BOOT-INF/classes/i18n/bundled/$code.json"; then
              echo "::error::the built image's jar has no i18n/bundled/$code.json — the language registry is off in this image (core#157)"
              missing=1
            fi
          done
          exit "$missing"

  # An order-dependent test passes in whatever ordering it was written under and fails in someone else's
  # PR months later (core#189). This runs the same suite with class and method order randomised, so the
  # dependence surfaces here rather than as a mystery red build on an unrelated change. Kept as its own
  # job: it is a second full six-minute run, and it should not delay the signal from the first one.
  shuffled-tests:
    name: Tests, randomised order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Run the suite in a random order
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon test \
            -Djunit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer\$Random \
            -Djunit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer\$Random

  # Backend CVEs. Dependabot watches the manifests; what it could not see was the transitive graph, so a
  # vulnerable dependency-of-a-dependency was reported nowhere (core#190). Submitting the resolved graph
  # puts those under the same Dependabot alerts as everything else — and costs one short job, rather than
  # the NVD download and API key an OWASP dependency-check task would need on every run.
  dependency-graph:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve and submit
        uses: gradle/actions/dependency-submission@v4
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
