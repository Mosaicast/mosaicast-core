#
# Version catalog for mosaicast-core. Spring Boot's BOM governs the versions of
# everything it manages; only libraries outside the BOM pin an explicit version here.

[versions]
springBoot = "4.1.0"
# The plugin contract this host builds against. MUST match the published SDK
# (dev.mosaicast:plugin-api / @mosaicast/plugin-sdk) and the manifest platformApi.
mosaicastSdk = "0.7.0"
rome = "2.1.0"
pf4j = "3.15.0"
shedlock = "7.7.0"
jsoup = "1.23.1"
commonsText = "1.15.0"
commonmark = "0.29.0"

[libraries]
# --- Mosaicast plugin SDK (consumed from mavenLocal — see README dev setup) ---
mosaicast-plugin-api = { module = "dev.mosaicast:plugin-api", version.ref = "mosaicastSdk" }
mosaicast-plugin-testkit = { module = "dev.mosaicast:plugin-testkit", version.ref = "mosaicastSdk" }

# --- Feed parsing (rome-modules adds the iTunes namespace: season/episode/duration) ---
rome = { module = "com.rometools:rome", version.ref = "rome" }
rome-modules = { module = "com.rometools:rome-modules", version.ref = "rome" }

# --- Fuzzy title matching for the reconciler's PLANNED binding (Jaro-Winkler) ---
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commonsText" }

# --- Plugin loading (plugins stay Spring-free: plain PF4J extensions) ---
pf4j = { module = "org.pf4j:pf4j", version.ref = "pf4j" }

# --- Scheduler locks (multi-instance-ready from day one) ---
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-provider-jdbc-template = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }

# --- HTML/SVG sanitizing (branding uploads, legal/wiki markdown) ---
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# --- Markdown rendering for the legal-pages mini-CMS (§12.6) ---
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
