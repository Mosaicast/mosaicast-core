#
# The single source of truth for the core application version. Everything else derives from it:
# Gradle uses it as project.version, it is filtered into build-metadata.properties and served at
# /api/meta, and the shell fetches it from there. Release builds override it from the git tag
# (-Pversion=<tag>). Scheme: minor tracks the milestone (M1 = 0.1.x, M2 = 0.2.x, …), independent of
# the plugin-contract (SDK) version.
version=0.5.18
